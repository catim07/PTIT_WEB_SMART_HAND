# ===================================================================
# SPRING SYSTEM CONFIGURATION
# ===================================================================
spring.application.name=backend
server.port=5000

# ===================================================================
# DATABASE CONFIGURATION: PERSISTENT EMBEDDED H2 (DEFAULT)
# ===================================================================
# We use file-based H2 database to persist your custom signatures, templates, and Markov states between restarts.
spring.datasource.url=jdbc:h2:file:./db/signlink_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable the H2 Console for debugging and grading at http://localhost:5000/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# DATABASE CONFIGURATION: POSTGRESQL (OPTIONAL TEMPLATE)
# To use PostgreSQL, run postgres locally, create database signlink_db, and uncomment the lines below:
# ===================================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/signlink_db
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=your_postgres_password

# ===================================================================
# JPA / HIBERNATE SETTINGS
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# If using PostgreSQL, uncomment this instead:
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# FILE MULTIPART AND OTHER CONFIGURATIONS
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable CORS globally for local development
spring.mvc.cors.allowed-origins=*
